services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tesla_pool
      POSTGRES_PASSWORD: tesla_pool_dev
      POSTGRES_DB: dhaka_tesla_pool
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tesla_pool -d dhaka_tesla_pool']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://tesla_pool:tesla_pool_dev@db:5432/dhaka_tesla_pool?schema=public
    ports:
      - '${API_HOST_PORT:-4000}:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # `wget` is not present in the node:*-slim base image, so probe with
      # Node itself (global fetch is available on Node 18+).
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4000}
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      - api

volumes:
  db_data:
