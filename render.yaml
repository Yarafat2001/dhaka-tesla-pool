# Render Blueprint - one-click free-tier deployment of the whole stack.
#
#   1. Push this repo to GitHub (already done: Yarafat2001/dhaka-tesla-pool).
#   2. Open https://render.com/deploy?repo=https://github.com/Yarafat2001/dhaka-tesla-pool
#      and sign in with GitHub. Render reads this file and creates, in order:
#        - a free Postgres instance,
#        - the API web service (backend/Dockerfile),
#        - the web app (frontend/Dockerfile) wired to the API's host.
#   3. Put the resulting https://<web-service>.onrender.com URL in the README's
#      Deployment section - that is the "Live Project Link".
#
# Notes that matter (see docs/deployment.md for the full walkthrough):
#   - Everything is in Singapore, the closest region to Dhaka, and shared, so
#     the services talk over Render's internal network.
#   - Render passes a service's environment variables to its Docker build, which
#     is how NEXT_PUBLIC_API_URL reaches `next build` (Next.js inlines it).
#   - `fromService.property: host` yields a *bare host* with no scheme; the
#     frontend normalises that to https (resolveApiBase in frontend/lib/api.ts).
#   - PORT is not set here: Render injects it and the API already reads
#     process.env.PORT (backend/src/index.ts).
#   - The API image runs `prisma migrate deploy && npm run seed && npm start` on
#     every boot, so schema and demo data are provisioned on first start.
#   - Free instances: Postgres expires 30 days after creation, and web services
#     spin down after 15 minutes idle (cold start on the next request).

databases:
  - name: dhaka-tesla-pool-db
    databaseName: dhaka_tesla_pool
    user: tesla_pool
    plan: free
    region: singapore
    # Empty allowlist: no public IP access. The API reaches this database over
    # Render's internal network using the connectionString below.
    ipAllowList: []

services:
  - type: web
    name: dhaka-tesla-pool-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dhaka-tesla-pool-db
          property: connectionString
      # Generated once by Render and never committed.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: web
    name: dhaka-tesla-pool-web
    runtime: docker
    plan: free
    region: singapore
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    # Custom domain(s). Render ALWAYS gives you a free permanent URL:
    #   https://<service-name>.onrender.com  (no expiry for web services)
    # The entries below are verified only once DNS points at Render; until
    # then they sit as "pending" and do NOT block the free onrender.com URL.
    # Paid target: www.dhaka-tesla-pool.com (plus apex, which redirects
    # to www in the app). Free alternative: any DuckDNS/is-a.dev name you
    # own - add it here alongside, e.g. dhaka-tesla-pool.duckdns.org.
    # See docs/deployment.md Options A1 (free) / A2 (paid).
    domains:
      - www.dhaka-tesla-pool.com
      - dhaka-tesla-pool.com
      - dhaka-tesla-pool.duckdns.org
    envVars:
      # Resolved by Render to the API service's host (no scheme); Next.js
      # inlines it during the Docker build, and frontend/lib/api.ts adds the
      # https scheme so the browser calls the API and not itself.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: dhaka-tesla-pool-api
          type: web
          property: host
